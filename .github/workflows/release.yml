# impl/13 §9, A10, ADR-0013. One run: ci -> plan -> build -> publish-stage -> smoke -> publish-promote
# -> publish-npm -> github-release. The GitHub release comes last: a failed publish-npm leaves none (D-RN-ORDER-1).
# Started by the /release skill with `gh workflow run`. mode=rollback runs only ci -> rollback.
# A pushed v2.* tag also starts it: the tag is the version, stage/promote reuse it, a x.y.z-<pre> version is a
# GitHub prerelease, never Latest, and npm gets dist-tag next (D-RN-TAG-1).
# Every ${{ }} value a shell reads goes through env, never into the run text.
# publish-npm: ADR-0019 D2, DEVIATIONS D-NPM-PUB-1.
# DEVIATIONS D-M6-arch-3, D-M6-arch-5, D-M6-Y1-1..5.
name: release
on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "publish release-out to npm with dist-tag next (needs the npm-publish environment)"
        required: false
        type: boolean
        default: false
      sha:
        description: "release: commit to release (empty = branch tip); rollback: prior release commit"
        required: false
        type: string
      mode:
        description: "release or rollback"
        required: false
        type: choice
        options: [release, rollback]
        default: release
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CLAUDE_CODE_NPM: "@anthropic-ai/claude-code@2.1.283"
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  plan:
    needs: ci
    if: ${{ inputs.mode != 'rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: local release branch for plan.mjs (D-M6-Y1-2)
        run: |
          heads="$(git ls-remote --heads origin refs/heads/release)"
          if [ -n "$heads" ]; then
            git fetch --no-tags origin +refs/heads/release:refs/heads/release
          fi
      - id: sha
        name: full commit sha (D-M6-Y1-3)
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: plan
        name: version and notes; a pushed v2.* tag is the version (D-RN-TAG-1)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            node scripts/release/plan.mjs --tag "$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            node scripts/release/plan.mjs >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install
        name: dev tooling (npm is dev-only, never shipped)
      - name: build, manifests, 3 skills, SHA256SUMS (D-M6-arch-3)
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: node build/build.mjs --out release-out --sha "$SHA" --version "$VERSION"
      - run: node docs/v2/prompt/lint.mjs --out release-out
      - run: npm install -g "$CLAUDE_CODE_NPM"
      - run: claude plugin validate release-out
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: "release-out/**"
      - uses: actions/upload-artifact@v4
        with:
          name: release-out
          path: release-out
          include-hidden-files: true
          if-no-files-found: error
  publish-stage:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: actions/download-artifact@v4
        with:
          name: release-out
          path: release-out
      - name: git identity for the release commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: commit release-out onto release-staging, draft tag (local only)
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release/publish.mjs --stage --version "$VERSION" --source-commit "$SHA"
  smoke:
    needs: [plan, publish-stage]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: npm install
        name: dev tooling (npm is dev-only, never shipped)
      - run: npm install -g "$CLAUDE_CODE_NPM" @openai/codex
      - run: node scripts/release/smoke.mjs --ref release-staging --agent claude-code
      - run: node scripts/release/smoke.mjs --ref release-staging --agent codex
      - run: npm install -g @google/gemini-cli
        continue-on-error: true   # tier-2 per GS2
      - run: node scripts/release/smoke.mjs --ref release-staging --agent gemini
        # D-RN-GEM-1: a hang must end at this step timeout, not at the job timeout
        timeout-minutes: 5
        continue-on-error: true   # tier-2 per GS2; failure here does not fail the job
  publish-promote:
    needs: [plan, smoke]
    if: ${{ inputs.mode != 'rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: actions/download-artifact@v4
        with:
          name: release-out
          path: release-out
      - name: git identity for the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: fast-forward release to release-staging, push tag (no GitHub release here, D-RN-ORDER-1)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release/publish.mjs --promote --version "$VERSION"
  publish-npm:
    needs: [plan, publish-promote]
    if: ${{ inputs.mode != 'rollback' && (inputs.publish || startsWith(github.ref, 'refs/tags/v2.')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: release-out
          path: release-out
      - name: npm must be 11.5.1 or newer (trusted publishing)
        run: |
          v="$(npm -v)"
          if [ "$(printf '%s\n11.5.1\n' "$v" | sort -V | head -1)" != "11.5.1" ]; then npm i -g npm@^11.5.1; fi
          npm -v
      - name: tarball must equal SHA256SUMS
        run: node scripts/release/check-npm-tarball.mjs release-out
      - name: publish with provenance, dist-tag next (never latest)
        working-directory: release-out
        run: npm publish --provenance --access public --tag next
  # D-RN-ORDER-1: run 40496186557 (v2.0.0-next.4) made the GitHub prerelease, then the publish-npm job failed.
  # Runs after publish-npm: on its success, or when it was skipped because publish=false and no v2.* tag.
  # A failed, cancelled or skipped-but-asked publish-npm leaves no GitHub release.
  github-release:
    needs: [plan, publish-promote, publish-npm]
    if: ${{ !cancelled() && inputs.mode != 'rollback' && needs.publish-promote.result == 'success' && (needs.publish-npm.result == 'success' || (needs.publish-npm.result == 'skipped' && !inputs.publish && !startsWith(github.ref, 'refs/tags/v2.'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: actions/download-artifact@v4
        with:
          name: release-out
          path: release-out
      - name: GitHub Release with SHA256SUMS, after publish-npm
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: node scripts/release/publish.mjs --github-release --version "$VERSION" --notes "$NOTES"
  rollback:
    needs: ci
    if: ${{ inputs.mode == 'rollback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: hard reset release to a prior release commit (no smoke, no tag)
        env:
          SHA: ${{ inputs.sha }}
        run: node scripts/release/rollback.mjs --sha "$SHA"
